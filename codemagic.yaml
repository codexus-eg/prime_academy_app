workflows:
  prime-academy-ios-testflight-workflow:
    name: Prime Academy iOS Build and Publish to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
          - prime_academy_Manual_Profile
        certificates:
          - ios_cert_manual

    scripts:
      - name: Set iOS deployment target
        script: |
          # تغيير إصدار iOS إلى 15.0 في إعدادات مشروع Xcode
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/Runner.xcodeproj/project.pbxproj

          # إجبار ملف Podfile على استخدام إصدار 15.0 سواء كان السطر مفعل أو كتعليق
          sed -i '' "s/^# platform :ios.*/platform :ios, '15.0'/g" ios/Podfile
          sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/g" ios/Podfile

      - name: Clean and Get Dependencies
        script: |
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          pod install --repo-update

      - name: Apply Vault Profiles
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
